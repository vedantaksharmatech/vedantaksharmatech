<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 6px;
    }
    .subtitle {
      font-family: 'Fira Code', 'Segoe UI', monospace, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 3px;
      fill: #94A3B8;
    }
    .badge {
      font-family: 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="220" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Tech Grid -->
  <rect width="900" height="220" rx="16" fill="url(#cyber-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="50" r="100" fill="#00F5D4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="750" cy="170" r="120" fill="#8B5CF6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="450" cy="110" r="80" fill="#EC4899" opacity="0.05" filter="url(#glow)"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="url(#neon-glow)" stroke-width="1.5" opacity="0.5"/>

  <!-- Top Accent Bar -->
  <path d="M 16 1 L 884 1" stroke="url(#neon-glow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Dynamic Wavy Vector Lines -->
  <path d="M 0 170 C 150 140, 300 200, 450 160 C 600 120, 750 190, 900 150" fill="none" stroke="url(#neon-glow)" stroke-width="2" opacity="0.45"/>
  <path d="M 0 185 C 180 155, 320 210, 500 175 C 680 140, 800 200, 900 170" fill="none" stroke="#00F5D4" stroke-width="1" opacity="0.25"/>

  <!-- Corner Tech Accents -->
  <path d="M 25 35 L 25 25 L 35 25" stroke="#00F5D4" stroke-width="2" fill="none"/>
  <path d="M 875 35 L 875 25 L 865 25" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <path d="M 25 185 L 25 195 L 35 195" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <path d="M 875 185 L 875 195 L 865 195" stroke="#00F5D4" stroke-width="2" fill="none"/>

  <!-- Main Name Heading -->
  <g filter="url(#subtle-glow)">
    <text x="450" y="98" text-anchor="middle" class="title" fill="url(#text-grad)">VEDANT SHARMA</text>
  </g>

  <!-- Tagline / Subtitle -->
  <text x="450" y="138" text-anchor="middle" class="subtitle">
    <tspan fill="#00F5D4">✦</tspan> AI/ML ENGINEER  <tspan fill="#64748B">|</tspan>  FULL-STACK ARCHITECT  <tspan fill="#64748B">|</tspan>  JAVA &amp; PYTHON DEVELOPER <tspan fill="#00F5D4">✦</tspan>
  </text>

  <!-- Status Pill -->
  <g transform="translate(370, 162)">
    <rect width="160" height="26" rx="13" fill="#1E293B" stroke="#00F5D4" stroke-width="1" opacity="0.9"/>
    <circle cx="16" cy="13" r="4" fill="#00F5D4"/>
    <text x="26" y="17" class="badge" fill="#E2E8F0">OPEN TO WORK</text>
  </g>
</svg>
